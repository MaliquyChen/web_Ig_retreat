<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動主控台 - Instagram 角色互動系統</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
</head>
<body>
  <!-- 頂部導覽列 -->
  <nav class="app-navbar">
    <div class="navbar-container">
      <a href="/" class="brand-logo">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
        <span class="gradient-text">Instagram 活動大廳</span>
      </a>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="切換深色/淺色主題">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主控台內容 -->
  <main class="main-wrapper">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem;" class="gradient-text">活動現場主控中心</h1>
      <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto; font-size: 1rem;">
        參加者掃描角色 QR Code 即刻開啟模擬 IG 發文頁；主控台可直接切換大螢幕投影！
      </p>
    </div>

    <!-- 快速開啟大螢幕 -->
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 2.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem;">📺 現場大螢幕 IG 投影牆</h3>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">開啟全螢幕個人檔案牆，支援動態即時同步與放大燈箱互動。</p>
      </div>
      <a href="/screen?character_id=char_1" class="btn-primary" style="padding: 0.75rem 1.5rem; font-size: 1rem;">
        開啟大螢幕投影頁面
      </a>
    </div>

    <!-- 角色測試與 QR CODE 列表 -->
    <h2 style="font-size: 1.3rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
      🎭 活動角色與掃描網址
    </h2>

    <div class="hub-grid">
      {% for cid, char in characters.items() %}
      <div class="character-card">
        <div class="card-avatar">
          <img src="{{ char.avatar }}" alt="{{ char.name }}">
        </div>
        <div>
          <h3 style="font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 2px;">
            {{ char.name }}
            <svg class="verified-badge" viewBox="0 0 24 24" aria-label="官方認證" title="官方認證"><path fill="#0095f6" d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.79-4-4-4-.495 0-.965.084-1.4.238C14.55 2.475 13.18 1.6 11.6 1.6c-1.58 0-2.95.875-3.6 2.148-.435-.154-.905-.238-1.4-.238-2.21 0-4 1.79-4 4 0 .495.084.965.238 1.4C1.575 9.55.7 10.92.7 12.5c0 1.58.875 2.95 2.148 3.6-.154.435-.238.905-.238 1.4 0 2.21 1.79 4 4 4 .495 0 .965-.084 1.4-.238 1.55 1.273 2.92 2.148 4.5 2.148 1.58 0 2.95-.875 3.6-2.148.435.154.905.238 1.4.238 2.21 0 4-1.79 4-4 0-.495-.084-.965-.238-1.4 1.273-.65 2.148-2.02 2.148-3.6zm-12.87 3.9l-4.13-4.13 1.41-1.41 2.72 2.72 6.59-6.59 1.41 1.41-8 8z"/></svg>
          </h3>
          <p style="color: var(--accent-blue); font-size: 0.85rem; font-weight: 600; margin-top: 0.2rem; display: flex; align-items: center; gap: 2px;">
            {{ char.handle }}
          </p>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-secondary); line-clamp: 2;">{{ char.bio }}</p>
        
        <div class="card-actions">
          <a href="/post?character_id={{ cid }}" class="btn-primary" style="justify-content: center; width: 100%;">
            📱 開啟手機發文頁
          </a>
          <a href="/screen?character_id={{ cid }}" class="btn-secondary" style="justify-content: center; width: 100%; text-align: center;">
            🖥️ 檢視 IG 個人檔案
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
