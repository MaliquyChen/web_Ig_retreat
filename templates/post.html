<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>建立新貼文 - {{ character.name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
</head>
<body>

  <!-- 頂部導覽列 (參加者發文介面，無後台與主控台連結) -->
  <nav class="app-navbar">
    <div class="navbar-container">
      <div class="brand-logo" style="cursor: default; user-select: none;">
        <svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
        <span>建立新貼文</span>
      </div>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="切換深色/淺色主題">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主要內容區 -->
  <main class="main-wrapper">
    
    <!-- 發文卡片 (模擬 IG 介面) -->
    <div class="post-card">
      <div class="post-card-header">
        <div class="character-info-sm">
          <img src="{{ character.avatar }}" alt="{{ character.name }}" class="avatar-sm">
          <div class="char-title-sm">
            <span class="char-name-sm" style="display: flex; align-items: center;">
              {{ character.name }}
              <svg class="verified-badge" viewBox="0 0 24 24" aria-label="官方認證" title="官方認證"><path fill="#0095f6" d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.79-4-4-4-.495 0-.965.084-1.4.238C14.55 2.475 13.18 1.6 11.6 1.6c-1.58 0-2.95.875-3.6 2.148-.435-.154-.905-.238-1.4-.238-2.21 0-4 1.79-4 4 0 .495.084.965.238 1.4C1.575 9.55.7 10.92.7 12.5c0 1.58.875 2.95 2.148 3.6-.154.435-.238.905-.238 1.4 0 2.21 1.79 4 4 4 .495 0 .965-.084 1.4-.238 1.55 1.273 2.92 2.148 4.5 2.148 1.58 0 2.95-.875 3.6-2.148.435.154.905.238 1.4.238 2.21 0 4-1.79 4-4 0-.495-.084-.965-.238-1.4 1.273-.65 2.148-2.02 2.148-3.6zm-12.87 3.9l-4.13-4.13 1.41-1.41 2.72 2.72 6.59-6.59 1.41 1.41-8 8z"/></svg>
            </span>
            <span class="char-handle-sm">{{ character.handle }}</span>
          </div>
        </div>
        <span class="auto-refresh-indicator">
          <span class="pulse-dot"></span> 現場連線中
        </span>
      </div>

      <!-- 表單 -->
      <form id="igPostForm" class="post-form-body" enctype="multipart/form-data">
        <input type="hidden" name="character_id" value="{{ character.id }}">

        <!-- 成功提示訊息 -->
        <div id="successBanner" class="success-banner">
          🎉 貼文發布成功！可至現場大螢幕即時查看！
        </div>

        <!-- 圖片上傳區塊 -->
        <div class="image-upload-dropzone" id="imageDropzone">
          <button type="button" class="remove-photo-btn" id="removePhotoBtn" title="移除照片">✕</button>
          
          <img id="imagePreview" class="image-preview" alt="預覽照片">

          <div class="dropzone-prompt" id="dropzonePrompt">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <p style="font-weight: 600; font-size: 1.05rem;">點擊選擇照片或拍照</p>
            <p style="font-size: 0.8rem;">支援現場拍照或從相簿選擇</p>
          </div>

          <input type="file" name="image" id="imageFileInput" class="file-input" accept="image/*" capture="environment">
        </div>

        <!-- 貼文內文輸入區 -->
        <div class="caption-group">
          <textarea id="captionTextarea" name="caption" class="caption-textarea" placeholder="撰寫內文或輸入線索說明..."></textarea>
          
          <!-- 實時藍色 Hashtag 預覽區 -->
          <div id="captionPreviewWrapper" class="caption-preview-wrapper" style="display: none;">
            <span class="preview-label">即時內文預覽：</span>
            <div id="captionLivePreview" class="caption-live-preview"></div>
          </div>

          <!-- 快捷 Hashtag 標籤按鈕 (角色專屬風格) -->
          <div class="hashtag-pills">
            {% for tag in character.get('hashtags', ['#活動現場2026', '#關鍵線索', '#VIP通關', '#解密成功']) %}
            <button type="button" class="pill-btn" data-tag="{{ tag }}">{{ tag }}</button>
            {% endfor %}
          </div>
        </div>

        <!-- 送出按鈕 -->
        <button type="submit" id="submitBtn" class="btn-primary form-submit-btn">
          分享
        </button>
      </form>
    </div>

  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
